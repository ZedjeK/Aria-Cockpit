# Release : pousser un tag « vX.Y.Z » teste, compile les deux variantes (autonome et légère), en fait les zips et leurs
# empreintes, atteste leur provenance, puis crée la release en BROUILLON. Tu relis les notes et tu publies : publier
# est le geste qui prévient les utilisateurs (l'appli lit la dernière release publiée), aucun workflow ne le fait à ta
# place.
#
#     git tag -a v1.2.3 -m "Version 1.2.3"; git push origin v1.2.3
#
# Avant de pousser le tag, trois choses doivent être fusionnées dans main :
#   - la version, dans Directory.Build.props (celle qu'affiche tools/version.ps1) ;
#   - les notes, dans docs/releases/<tag>.md ;
#   - le code, bien sûr : un tag posé sur une branche non fusionnée est refusé.
#
# Deux jobs : « build » ne fait que lire (tests, exes, zips, empreintes) ; « publication » est le seul dont le jeton
# peut écrire, et il n'exécute aucun code du dépôt.
#
# Essai à blanc : Actions → Release → Run workflow lance le job « build » seul. Les zips sont fabriqués et gardés
# 7 jours comme artefact du run ; aucun tag, aucune release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : il faut pouvoir situer le tag par rapport à la branche par défaut

      - name: Le tag est sur la branche par défaut
        if: github.ref_type == 'tag'
        env:
          BRANCHE: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:BRANCHE"
          if ($LASTEXITCODE -ne 0) {
            throw "Le tag $env:GITHUB_REF_NAME pointe sur un commit qui n'est pas dans $env:BRANCHE : aucune release."
          }

      - name: Le tag est celui de la version, et ses notes sont prêtes
        if: github.ref_type == 'tag'
        run: |
          $version = "$(./tools/version.ps1 | Select-Object -Last 1)".Trim()
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version donnée par tools/version.ps1."
          }
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Notes de version absentes : $notes. Elles se fusionnent dans main avant de pousser le tag."
          }
          if ((Get-Content -LiteralPath $notes -Raw -Encoding utf8) -match '\{VERSION\}|\{REPO_URL\}') {
            throw "$notes contient encore un marqueur du modèle ({VERSION} ou {REPO_URL})."
          }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: ./tools/tester.ps1

      - name: Zips et empreintes des deux variantes
        run: ./tools/empaqueter.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .work/release/*.zip
            .work/release/*.zip.sha256
          include-hidden-files: true # .work commence par un point : sans cette ligne, l'action ignorerait les zips
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: build
    # Seulement sur un tag poussé : l'essai à blanc s'arrête après « build »
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Seulement pour lire les notes de version : aucun code du dépôt n'est exécuté dans ce job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $fichiers = @(
            "release/Aria-Cockpit-$version-autonome.zip", "release/Aria-Cockpit-$version-autonome.zip.sha256",
            "release/Aria-Cockpit-$version-leger.zip", "release/Aria-Cockpit-$version-leger.zip.sha256"
          )
          foreach ($f in $fichiers) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "Fichier attendu absent : $f" }
          }
          gh release create $env:GITHUB_REF_NAME @fichiers --draft --verify-tag --title "Aria Cockpit $version" --notes-file "docs/releases/$env:GITHUB_REF_NAME.md"
          if ($LASTEXITCODE -ne 0) { throw "La release en brouillon n'a pas pu être créée." }
