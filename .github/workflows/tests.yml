# Tests automatiques d'Aria Cockpit, sur une machine Windows de GitHub (sans carte NVIDIA, Windows en anglais) :
# à chaque PR vers main et à chaque push sur main. Les tests n'utilisent ni le matériel ni le système,
# ils doivent donc passer ici comme sur n'importe quel PC.

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Machine de test
        run: |
          "Windows : $([Environment]::OSVersion.VersionString)"
          "Langue : $((Get-Culture).Name)"
          "Cartes graphiques : $((Get-CimInstance Win32_VideoController).Name -join ', ')"

      - name: Lancer les tests
        run: ./tools/tester.ps1
